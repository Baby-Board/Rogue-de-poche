function shRules(){return sheet('Règles',`<div class="rules">
 <h4>La run</h4><p>Une run se joue dans un monde, qui couvre une tranche de niveaux. Chaque monde enchaîne 6 zones ; chaque zone est une carte qu'on traverse jusqu'au donjon. Battre le boss du donjon ouvre la zone suivante ; battre le dernier boss gagne la run. Tu pars avec deux héros et tu peux en recruter d'autres en taverne, jusqu'à quatre.</p>
 <h4>Les PV</h4><p>Les PV ne remontent pas entre deux combats. Pour se soigner : la taverne (la moitié des PV max, et relève les K.O.), les potions, et la victoire contre un boss de donjon, qui remet toute l'équipe sur pied. Si toute l'équipe tombe, la run s'arrête : tu perds les héros, l'équipement et les écus.</p>
 <h4>La carte</h4><ul><li>${ico('fight')} <b>Combat</b> : un groupe de monstres.</li><li>${ico('hard')} <b>Combat dur</b> : des ennemis renforcés (le bonus s'affiche quand tu touches la case), mais un meilleur butin.</li><li>${ico('taverne')} <b>Taverne</b> : soin ou recrutement.</li><li>${ico('sanct')} <b>Sanctuaire</b> : plus de monstres alpha pour le reste de la run.</li><li>${ico('portal')} <b>Portail</b> : la rencontre n'est révélée qu'en arrivant.</li><li>${ico('shop')} <b>Comptoir</b> : acheter et revendre des objets.</li><li>${ico('forge')} <b>Forge</b> : faire monter un objet d'une rareté.</li><li>${ico('boss')} <b>Donjon</b> : le boss de la zone.</li></ul>
 <h4>Le combat</h4><p>Chacun joue à son tour, dans l'ordre d'initiative affiché en haut. Chaque héros dépense ses PA en sorts ou en attaque d'arme. Chaque camp a une ligne avant et une ligne arrière : la plupart des attaques ne visent que la ligne avant ; quand elle est vide, la ligne arrière est exposée. Tu places tes héros dans l'écran Formation.</p><p>L'élément de frappe est choisi tout seul : à chaque coup, le héros frappe dans celui de ses deux éléments que la cible résiste le moins. Les résistances des monstres s'affichent sur leur carte.</p>
 <h4>Les caractéristiques</h4><ul><li><b>Force</b> ${elIco('t')} : donne aussi des PV.</li><li><b>Intelligence</b> ${elIco('f')} : augmente aussi tous les dégâts et les soins.</li><li><b>Agilité</b> ${elIco('a')} : chance et dégâts de coup critique, et esquive.</li><li><b>Chance</b> ${elIco('e')} : donne aussi de la prospection, qui fait tomber plus d'objets et d'écus.</li></ul><p>Les caractéristiques montent toutes seules avec le niveau.</p>
 <h4>Équipement et écus</h4><p>Chaque héros porte une arme, une coiffe, une cape et un anneau. Les objets tombent en combat, en six raretés : <span class="r0">commun</span>, <span class="r1">rare</span>, <span class="r2">épique</span>, <span class="r3">légendaire</span>, <span class="r4">mythique</span> et <span class="r5">divin</span> (extrêmement rare). Les quatre pièces d'une même panoplie donnent +1 PA. ★ Adapt. s'ajoute aux deux éléments du héros qui le porte. Les écus ${coin()} se gagnent en combat et en revendant des objets au comptoir ; ils servent au comptoir et à la forge.</p>
 <h4>Ce qui reste après la mort</h4><p>Les talismans : chacun donne un bonus permanent à toutes tes runs suivantes. On les obtient en terminant les groupes de quêtes du menu Succès. Restent aussi le bestiaire, les reliques et la progression des quêtes.</p>
 <h4>Monstres alpha</h4><p>N'importe quel monstre peut apparaître en version alpha, plus forte. La vaincre l'ajoute au bestiaire. Le bestiaire complet du Monde 1 donne le Talisman d'Ambre.</p>
 <h4>Étoiles</h4><p>Les étoiles d'un monde règlent sa difficulté, d'une (normal) à cinq. Gagner une run débloque l'étoile suivante, et gagner un monde ouvre le monde suivant.</p></div>`)}
function shTalis(){const n=Object.keys(meta.talis).length;return sheet('Talismans',`<p class="mute" style="margin:0">${n} / ${TALIS.length} talismans. Ils survivent à la mort et s'appliquent à chaque run.</p>
  <div class="tgrid">${TALIS.map(t=>`<button class="tal ${meta.talis[t.id]?'':'off'}" style="--tc:${TALC[t.id]}" data-a="questT" data-v="${t.id}"><span class="egg"></span><b>${t.n.replace(/^Talisman (de |d'|du )/,'').replace(/^./,c=>c.toUpperCase())}</b><small class="mute">${t.b}</small></button>`).join('')}</div><p class="mute" style="margin:0;font-size:13px">Touche un talisman pour voir les quêtes qui le débloquent.</p>`)}
function shQuests(){const done=Object.keys(meta.quests).filter(q=>QUESTS[q]).length,tot=Object.keys(QUESTS).length;return sheet('Succès',`<p class="mute" style="margin:0">${done} / ${tot} quêtes · ${Object.keys(meta.talis).length} / ${TALIS.length} talismans</p>
  ${TALIS.map(t=>{const d=t.q.filter(q=>meta.quests[q]).length,open=ui.questT===t.id;return`<div class="hcard"><button class="bline" style="border:0;background:none;padding:0" data-a="questT" data-v="${t.id}"><span class="tal ${meta.talis[t.id]?'':'off'}" style="--tc:${TALC[t.id]};padding:0;border:0;background:none"><span class="egg" style="width:30px;height:37px"></span></span><div class="meta"><b>${t.n}</b><small>${t.b}${meta.talis[t.id]?' · obtenu':''}</small><div class="prog"><i style="width:${d/t.q.length*100}%"></i></div></div><span class="num mute">${d}/${t.q.length}</span></button>
   ${open?t.q.map(q=>`<div class="qline ${meta.quests[q]?'done':''}"><span class="ck">${meta.quests[q]?'✓':''}</span>${QUESTS[q][0]}</div>`).join(''):''}</div>`}).join('')}`)}
function shBest(){const w=ui.bestW,W=WORLDS[w];const caught=W.roster.filter((_,k)=>meta.alphas[w+'_'+k]).length;
  return sheet('Bestiaire',`<div class="tabs">${WORLDS.map((X,i)=>`<button class="tab ${i===w?'on':''}" data-a="bestw" data-v="${i}" ${i>=meta.unlocked?'disabled style="opacity:.4"':''}>Monde ${i+1}</button>`).join('')}</div>
  <p class="mute" style="margin:0">${W.n} · Alphas ${caught}/${W.roster.length} · Reliques ${W.zones.filter((_,z)=>meta.relics[w+'_'+z]).length}/${ZONES}</p>
  ${W.zones.map((Z,z)=>{const ms=Z[3];const c=ms.filter(k=>meta.alphas[w+'_'+k]).length;const open=ui.bestZ===z;return`<div class="hcard" style="padding:8px"><button class="bline" style="border:0;background:none;padding:0" data-a="bestz" data-v="${z}"><span class="bline-ico" style="font-size:26px">${Z[1]}</span><div class="meta"><b>${Z[0]}</b><small>Alphas ${c}/${ms.length} · Boss : ${Z[2][0]} ${Z[2][1]}${meta.relics[w+'_'+z]?' · relique ✓':''}</small></div><span class="mute">${open?'▾':'▸'}</span></button>
   ${open?ms.map(k=>{const r=W.roster[k],ok=meta.alphas[w+'_'+k];return`<div class="qline ${ok?'done':''}"><span class="ck">${ok?'✓':''}</span>${r[1]} ${r[0]} <span class="mute">· ${ARCHN[r[2]]} · ${elIco(r[3])}</span></div>`}).join(''):''}</div>`}).join('')}
  <p class="mute" style="margin:0;font-size:13px">Armurerie : ${Object.keys(meta.armory).length} objets différents trouvés.</p>`)}
const ARCHN={brute:'Brute',tank:'Colosse',rapide:'Rapide',tireur:'Tireur',mage:'Mage',soigneur:'Soigneur',toxique:'Toxique'};
function spellLine(id,sp,h){const rg=h&&sp.base?spellRange(h,sp,null):null;const lim=[sp.pt?sp.pt+'×/tour':'',sp.tcd?'même cible : '+sp.tcd+' tours d’attente':'',sp.ptt?'1×/cible/tour':'',sp.pc?'1×/combat':'',sp.cd?'relance après '+sp.cd+' tours':''].filter(Boolean).join(' · ');
  return`<div><b>${sp.n}</b> · ${sp.pa} PA${sp.base?` · <span class="rg">${sp.heal?'✚':sp.trap?'🪤':'⚔'} ${rg?rangeTxt(rg):(sp.alt?sp.alt[0]+'–'+sp.alt[1]+' ou ':'')+sp.base[0]+'–'+sp.base[1]}</span>`:''}<br>${sp.txt} <span style="color:var(--ink2)">${TGL[sp.tg]}${lim?' · '+lim:''}</span></div>`}
function shEnc(){const c=ui.encCls,k=CLASSES[c];return sheet('Classes',`<p class="mute" style="margin:0">Les dégâts affichés sont les jets de base, avant caractéristiques. L'élément est choisi selon la cible.</p>
  <div class="tabs">${ORDER.map(x=>`<button class="tab ${x===c?'on':''}" data-a="enc" data-v="${x}" aria-label="${CLASSES[x].n}">${clsAva(x,'sm')}</button>`).join('')}</div>

  <div class="splist">${k.sp.map(id=>spellLine(id,SP[id])).join('')}<div><b>Attaque d'arme</b> · selon l'arme équipée · Ennemi (ligne avant)</div></div></div>`)}
function shStats(){return sheet('Caractéristiques',`<p class="mute" style="margin:0">Les caractéristiques montent seules, selon l'archétype de chaque classe. Entre parenthèses : le bonus de l'équipement.</p>
  ${run.heroes.map(h=>{const S=hstats(h),cap=h.lvl>=heroCap();return`<div class="hcard"><div class="top">${ava(h)}<div class="meta"><b>${h.name}</b> · niv. ${h.lvl} · ${CLASSES[h.cls].role} ${els(h.cls)}</div></div>
   <div class="xp"><i style="width:${cap?100:h.xp/xpNeed(h.lvl)*100}%"></i><span>${cap?'Niveau max du monde':`XP ${fmt(h.xp)} / ${fmt(xpNeed(h.lvl))}`}</span></div>

   <div class="chips">${EL.map(e=>`<span class="chip">${elIco(e)} rés. ${S.res[e]}%</span>`).join('')}</div></div>`}).join('')}`)}
function shForm(){const inC=run.phase==='combat';const cell=(row,i)=>{const h=run.heroes.find(x=>x.row===row&&x.slot===i);const sel=ui.form&&h&&ui.form===h.id;return`<button class="fslot ${h?'full':''} ${sel?'sel':''}" ${inC?'disabled':`data-a="formslot" data-v="${row}:${i}"`}>${h?`${ava(h,'sm')}<span>${h.name}</span><span>${els(h.cls)}</span>`:'+'}</button>`};
  normSlots();
  return sheet('Formation',`<p class="mute" style="margin:0">${inC?'Impossible de changer la formation pendant un combat.':"Touche un héros, puis la case où l'envoyer (ou un autre héros pour échanger). La ligne avant encaisse les attaques de ligne ennemies ; la ligne arrière est protégée tant que l'avant tient."}</p>
  <span class="lab">Ligne avant</span><div class="fgrid">${[0,1,2,3].map(i=>cell('front',i)).join('')}</div>
  <span class="lab">Ligne arrière</span><div class="fgrid">${[0,1,2,3].map(i=>cell('back',i)).join('')}</div>`)}
function normSlots(){['front','back'].forEach(r=>{const l=run.heroes.filter(h=>h.row===r).sort((a,b)=>(a.slot||0)-(b.slot||0));const used=new Set();l.forEach(h=>{if(h.slot==null||h.slot>3||used.has(h.slot)){let s=0;while(used.has(s))s++;h.slot=s}used.add(h.slot)})})}
function shInv(){const h=run.heroes[ui.invHero]||run.heroes[0];const S=hstats(h);const sets={};Object.values(h.eq).forEach(x=>{if(x&&x.set!=='relic')sets[x.setN]=(sets[x.setN]||0)+1});
  return sheet('Équipement',`<div class="tabs">${run.heroes.map((x,i)=>`<button class="tab ${x===h?'on':''}" data-a="invh" data-v="${i}">${ava(x,'sm')} ${x.name}</button>`).join('')}</div>
  <div class="chips"><span class="chip">PV max ${S.hp}</span><span class="chip" style="color:#bfe3ff">${S.pa} PA</span><span class="chip">Prosp. ${S.pp}</span></div>
  <div class="stack">${Object.keys(SLOTS).map(s=>{const it=h.eq[s];return it?itemBtn(it,`<span class="slotlab">${SLOTS[s]}</span>`):`<div class="item" style="opacity:.55;border-style:dashed"><div class="it-top"><span class="it-ico">${ico(s)}</span><b class="mute">${SLOTS[s]} : vide</b></div></div>`}).join('')}</div>
  ${Object.entries(sets).map(([n,c])=>`<div class="chips"><span class="chip ${c>=4?'g':''}">${n} ${c}/4${c>=4?' · +1 PA ✓':' · 4 pièces : +1 PA'}</span></div>`).join('')}
  <div style="display:flex;align-items:center;gap:8px"><span class="lab" style="flex:1">Sac (${run.inv.length})</span><button class="tab ${ui.invSort==='tier'?'on':''}" data-a="invsort" data-v="tier">Palier</button><button class="tab ${ui.invSort==='type'?'on':''}" data-a="invsort" data-v="type">Type</button></div>
  <div class="stack">${sortedInv().map(it=>itemBtn(it)).join('')||'<p class="mute">Le sac est vide.</p>'}</div>`)}
function shItem(){const f=findItem(ui.itemId);if(!f)return null;const it=f.it;const h=run.heroes[ui.invHero]||run.heroes[0];const cur=h.eq[it.slot];
  let diff='';if(f.where==='inv'){const keys=[...new Set(Object.keys(it.st).concat(cur?Object.keys(cur.st):[]))];diff=keys.map(k=>{const d=(it.st[k]||0)-(cur?cur.st[k]||0:0);return d?`<span class="chip ${d>0?'up':'dn'}">${d>0?'+':''}${d} ${STL[k]}</span>`:''}).join('')}
  let wdiff='';if(f.where==='inv'&&it.w){const ca=cur&&cur.w?cur.w:{a:3,b:5};const da=Math.round((it.w.a+it.w.b)/2-(ca.a+ca.b)/2);if(da)wdiff=`<span class="chip ${da>0?'up':'dn'}">${da>0?'+':''}${da} ⚔ moy.</span>`}
  const atShop=run.phase==='shop',atForge=run.phase==='forge';
  return sheet(SLOTS[it.slot],`<div class="item ir${it.r}">${itemHTML(it)}</div>
  ${f.where!=='inv'?`<p class="mute" style="margin:0">Porté par ${f.where.name}.</p><button class="btn" data-a="unequip" data-v="${it.id}">Retirer</button>`:`
   <div class="tabs">${run.heroes.map((x,i)=>`<button class="tab ${x===h?'on':''}" data-a="invh" data-v="${i}">${ava(x,'sm')} ${x.name}</button>`).join('')}</div>
   <div class="cmp"><span class="lab">Équipé sur ${h.name}</span>${cur?`<div class="item ir${cur.r}">${itemHTML(cur)}</div>`:'<p class="mute" style="margin:0">Rien dans cet emplacement.</p>'}
   ${diff||wdiff?`<span class="lab">Si tu équipes le nouvel objet</span><div class="chips">${diff}${wdiff}</div>`:''}</div>
   <button class="btn main" data-a="equip" data-v="${it.id}">Équiper sur ${h.name}</button>`}
  ${atShop&&f.where==='inv'?`<button class="btn" data-a="sell" data-v="${it.id}">Vendre · ${coin()} ${fmt(sellPrice(it))}</button>`:''}
  ${atForge&&it.r<FORGE_MAX?`<button class="btn" data-a="forge" data-v="${it.id}" ${run.gold<forgeCost(it)?'disabled':''}>Forger en <span class="r${it.r+1}">${RAR[it.r+1].l}</span> · ${coin()} ${fmt(forgeCost(it))}</button>`:''}
  ${!atShop&&f.where==='inv'?'<p class="mute" style="margin:0;font-size:13px">Les objets se revendent au comptoir.</p>':''}`)}
function shPotion(){return sheet('Potions',`<p class="mute" style="margin:0"><b style="color:#a9f0b8">${run.potions} potion${run.potions>1?'s':''}</b> sur ${run.potMax}. Une potion rend 35 % des PV max à un héros (pas aux K.O.). Chaque donjon vaincu en rend une.</p>
  <div class="stack">${run.heroes.map(h=>`<button class="bline" data-a="drink" data-v="${h.id}" ${!run.potions||!h.alive||h.hp>=maxHp(h)||run.phase==='combat'?'disabled style="opacity:.45"':''}>${ava(h,'sm')}<div class="meta"><b>${h.name}</b><small>${h.alive?`${h.hp}/${maxHp(h)} PV`:'K.O.'}</small></div>${ico('potion')}</button>`).join('')}</div>
  ${run.phase==='combat'?'<p class="mute" style="margin:0">Les potions se boivent hors combat.</p>':''}`)}
function shLog(){const c=C();return sheet('Journal',`<div class="log" style="display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--mute)">${c?c.log.slice().reverse().map(l=>`<div>${l}</div>`).join(''):''}</div>`)}
function shInspect(){const u=unit(ui.inspect);if(!u)return null;
  if(u.side==='e')return sheet(u.name,`<div class="hcard"><div class="top">${ava(u)}<div class="meta"><b class="num">${u.hp}/${u.hpMax} PV</b><br><small class="mute">Niveau ${u.lvl} · ${u.boss?'Boss':u.melee?'Mêlée':'Distance'} · frappe en ${ELN[u.el]} ${elIco(u.el)} · init. ${u.init}${u.alpha?' · alpha':''}</small></div></div>
    <span class="lab">Résistances</span><div class="chips">${EL.map(e=>`<span class="chip ${u.res[e]<0?'up':u.res[e]>0?'dn':''}">${elIco(e)} ${u.res[e]>0?'+':''}${u.res[e]}%</span>`).join('')}</div>

   <div class="chips">${EL.map(e=>`<span class="chip">${elIco(e)} ${S.res[e]}%</span>`).join('')}${stChips(u)}${u.st.shield?`<span class="chip s">🛡 ${u.st.shield}</span>`:''}</div>

function shMenu(){return sheet('Menu',`<div class="iconbar" style="flex-wrap:wrap">${TOOLS.concat([['rules','scroll','Règles']]).map(([k,i,l])=>`<button class="ib" data-a="sheet" data-v="${k}">${ico(i)}${l}</button>`).join('')}</div>
  <button class="btn" data-a="home">${ico('home')} Retour à l'accueil</button><p class="mute" style="margin:0;font-size:13px">La run est enregistrée à chaque action.</p>`)}
/* ================= Actions ================= */
const A={
  world:v=>{ui.world=+v;ui.star=meta.worlds[ui.world].starMax;store.set('rdp2_ui_w',ui.world);render()},
  star:v=>{ui.star=+v;render()},
  play:()=>{ui.pick=[];ui.screen='pick';render()},
  pickc:c=>{const p=ui.pick;const i=p.indexOf(c);if(i>=0)p.splice(i,1);else{if(p.length>=2)p.shift();p.push(c)}render()},
  start:()=>{if(ui.pick.length!==2)return;startRun(ui.pick);ui.screen='run';render()},
  continue:()=>{ui.screen='run';ui.confirm=null;render();resume()},
  home:()=>{ui.screen='home';ui.modal=null;ui.confirm=null;clearTimeout(timer);busy=false;render()},
  confirm:v=>{ui.confirm=v||null;render()},
  abandon:()=>{clearTimeout(timer);busy=false;meta.cnt.runsEnded++;run.phase='end';updateZoneMax();checkQuests();saveMeta();run=null;saveRun();ui.confirm=null;render()},
  endok:()=>{run=null;saveRun();ui.screen='home';ui.star=meta.worlds[ui.world].starMax;render()},
  sheet:v=>{ui.modal=v;if(v==='inv'||v==='item'){}if(v==='best'&&run)ui.bestW=run.w;render()},
  close:()=>{ui.modal=null;ui.form=null;render()},
  mapsel:v=>{ui.mapSel=ui.mapSel===v?null:v;render()},
  go:v=>{const [r,i]=v.split(':').map(Number);enterNode(r,i)},
  spell:id=>{const c=C();const h=unit(c.cur);if(!h||h.side!=='h'||busy)return;if(blockReason(h,id))return;const sp=spellOf(h,id);
    if(ui.sel===id&&!targetsFor(h,sp))return cast(h,id,null);ui.sel=ui.sel===id?null:id;render()},
  target:id=>{const c=C();const h=unit(c.cur);if(!h||!ui.sel||busy)return;const t=unit(id);const sp=spellOf(h,ui.sel);const vt=validTargets(h,ui.sel);if(!vt||!vt.includes(t))return;cast(h,ui.sel,t)},
  inspect:id=>{ui.inspect=id;ui.modal='inspect';render()},
  end:()=>{clearTimeout(timer);endHeroTurn(false)},
  lootok:()=>afterLoot(),
  msgok:()=>{run.msg=null;run.phase='map';saveRun();render()},
  leave:()=>{run.tav=null;run.shop=null;run.phase='map';ui.modal=null;saveRun();render()},
  tavheal:()=>{run.heroes.forEach(h=>{if(!h.alive){h.alive=true;h.hp=0}h.hp=Math.min(maxHp(h),h.hp+Math.round(maxHp(h)*.5));h.st={}});meta.cnt.tavHeals++;run.tav.done="L'équipe mange, boit et dort. Chacun récupère la moitié de ses PV max.";checkQuests();saveRun();render()},
  recruit:c=>{if(run.heroes.length>=4)return;meta.cnt.recruits=(meta.cnt.recruits||0)+1;const lv=Math.max(...run.heroes.map(h=>h.lvl));const h=newHero(c,Math.max(WORLDS[run.w].lv[0],lv-1));normSlots();const used=run.heroes.filter(x=>x.row===h.row).map(x=>x.slot);let s=0;while(used.includes(s))s++;if(s>3){h.row=h.row==='front'?'back':'front';const u2=run.heroes.filter(x=>x.row===h.row).map(x=>x.slot);s=0;while(u2.includes(s))s++}h.slot=s;run.heroes.push(h);
    starterKit(h,h.lvl,run.w);
    meta.cnt.maxTeam=Math.max(meta.cnt.maxTeam,run.heroes.length);run.tav.done=`${CLASSES[c].n} rejoint l'équipe au niveau ${h.lvl}, ${run.w?'avec une panoplie de départ':'sans équipement'}. Place-le dans la Formation si besoin.`;checkQuests();saveMeta();saveRun();render()},
  sellgreen:()=>{if(run.phase!=='shop')return;const g=run.inv.filter(x=>x.r===0);const p=g.reduce((s,x)=>s+sellPrice(x),0);run.gold+=p;meta.cnt.sold+=g.length;run.inv=run.inv.filter(x=>x.r!==0);meta.cnt.maxGold=Math.max(meta.cnt.maxGold,run.gold);toast(`${g.length} objets vendus : +${fmt(p)} ✦`);checkQuests();saveMeta();saveRun();render()},
  shoptab:v=>{ui.shopTab=v;render()},
  buy:i=>{const x=run.shop.items[+i];if(x.sold||run.gold<x.price)return;run.gold-=x.price;meta.cnt.spent+=x.price;meta.cnt.bought++;x.sold=true;addInv(x.it);toast(x.it.name+' ajouté au sac');checkQuests();saveMeta();saveRun();render()},
  item:id=>{ui.itemId=id;ui.modal='item';render()},
  invh:i=>{ui.invHero=+i;render()},
  invsort:v=>{ui.invSort=v;render()},
  equip:id=>{const f=findItem(id);const h=run.heroes[ui.invHero]||run.heroes[0];if(!f||f.where!=='inv')return;equip(h,f.it);ui.modal=run.phase==='loot'?null:'inv';saveMeta();saveRun();render()},
  unequip:id=>{const f=findItem(id);if(!f||f.where==='inv')return;unequip(f.where,f.it.slot);ui.modal='inv';saveRun();render()},
  sell:id=>{const f=findItem(id);if(!f||f.where!=='inv'||run.phase!=='shop')return;const p=sellPrice(f.it);run.gold+=p;run.inv=run.inv.filter(x=>x.id!==id);meta.cnt.sold++;meta.cnt.maxGold=Math.max(meta.cnt.maxGold,run.gold);ui.modal=null;toast(`Vendu : +${fmt(p)} ✦`);checkQuests();saveMeta();saveRun();render()},
  forge:id=>{const f=findItem(id);if(!f||f.it.r>=FORGE_MAX)return;const c=forgeCost(f.it);if(run.gold<c)return;const h=f.where!=='inv'?f.where:null;const before=h?maxHp(h):0;run.gold-=c;meta.cnt.spent+=c;forgeItem(f.it);if(h&&h.alive)h.hp=clamp(h.hp+maxHp(h)-before,1,maxHp(h));toast(`${f.it.name} devient ${RAR[f.it.r].l} !`);checkQuests();saveMeta();saveRun();render()},
  drink:id=>{const h=run.heroes.find(x=>x.id===id);if(!h||!h.alive||!run.potions||run.phase==='combat')return;run.potions--;healPct(h,.35);meta.cnt.potions++;checkQuests();saveMeta();saveRun();render()},
  formslot:v=>{const [row,i]=v.split(':');const s=+i;const occ=run.heroes.find(x=>x.row===row&&x.slot===s);
    if(!ui.form){if(occ)ui.form=occ.id;return render()}
    const h=run.heroes.find(x=>x.id===ui.form);if(!h){ui.form=null;return render()}
    if(occ&&occ!==h){occ.row=h.row;occ.slot=h.slot}h.row=row;h.slot=s;ui.form=null;saveRun();render()},
  questT:v=>{ui.questT=ui.questT===v?null:v;ui.modal='quests';render()},
  bestw:v=>{ui.bestW=+v;ui.bestZ=null;render()},
  bestz:v=>{ui.bestZ=ui.bestZ===+v?null:+v;render()},
  enc:v=>{ui.encCls=v;render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v)});
modal.addEventListener('click',e=>{if(e.target===modal){ui.modal=null;ui.form=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
function resume(){
  if(!run||run.phase!=='combat'||!C())return;const c=C();
  if(c.over){return later(()=>{c.enemies.some(e=>e.alive)?defeat():victory()},300)}
  const u=unit(c.cur);
  if(!u||!u.alive){busy=false;return later(nextTurn,300)}
  if(u.side==='e'){busy=true;render();later(()=>enemyAct(u),600)}
  else{busy=false;render();if(!anyCastable(u))autoPass(u)}}

/* ================= Boot ================= */
function boot(data){if(data&&data.run){run=data.run;ui.screen=data.screen||'home'}checkQuests();render();if(ui.screen==='run')resume()}
try{window.claude?.hot?.snapshot?.(()=>({run,screen:ui.screen}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
