const META_KEY='rdp2_meta',RUN_KEY='rdp2_run';
const CNT0={runs:0,runsEnded:0,wins:0,hardWins:0,flawless:0,bossKills:0,maxHit:0,crits:0,alphaKills:0,portals:0,sanct:0,sold:0,maxInv:0,spent:0,bought:0,setDone:0,potions:0,tavHeals:0,revives:0,forgeLeg:0,maxGold:0,maxTeam:0,bestStarWin:0,kills:0};
function freshMeta(){return{unlocked:1,worlds:WORLDS.map(()=>({starMax:1,zoneMax:0,wins:0,runs:0})),alphas:{},relics:{},talis:{},quests:{},armory:{},cnt:{...CNT0}}}
let meta=store.get(META_KEY,null)||freshMeta();
meta.cnt=Object.assign({...CNT0},meta.cnt);
let run=store.get(RUN_KEY,null);
/* migrate: relics used to be equippable items */
if(run){const isR=x=>x&&(x.relic||x.set==='relic');(run.inv||[]).filter(isR).forEach(x=>{if(x.relic)meta.relics[x.relic]=1});run.inv=(run.inv||[]).filter(x=>!isR(x));(run.heroes||[]).forEach(h=>{for(const s in h.eq)if(isR(h.eq[s])){meta.relics[h.eq[s].relic]=1;h.eq[s]=null}});if(run.loot)run.loot.items=(run.loot.items||[]).filter(x=>!isR(x));store.set(RUN_KEY,run);store.set(META_KEY,meta)}
let ui={screen:'home',world:0,star:1,sel:null,modal:null,confirm:null,pick:[],lastScreen:null,mapSel:null,invHero:0,itemId:null,inspect:null,encCls:'lame',bestW:0,bestZ:null,questT:null,form:null,shopTab:'buy',invSort:'tier'};
ui.world=Math.min(meta.unlocked-1,store.get('rdp2_ui_w',0));ui.star=meta.worlds[ui.world].starMax;
let busy=false,timer=null,fxq=[];
const saveRun=()=>{run?store.set(RUN_KEY,run):store.del(RUN_KEY)};
const saveMeta=()=>store.set(META_KEY,meta);
function later(fn,ms){clearTimeout(timer);timer=setTimeout(fn,ms)}
function toast(msg){const box=document.getElementById('toasts');const d=document.createElement('div');d.className='toast';d.textContent=msg;box.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ================= Talismans ================= */
function relB(){const B={hp:0,crit:0,dmg:0,res:0,pp:0,soin:0};for(const k in meta.relics){const [w,z]=k.split('_').map(Number);if(WORLDS[w]&&RELFX[z])B[RELFX[z][0]]+=relicVal(w,z)}return B}
function talB(){const T={hp:0,dmg:0,pp:0,crit:0,pa:0,res:0,potion:0,gold:0,stat:0,pierce:0};const o=meta.talis;
  if(o.mousse)T.hp+=8;if(o.braise)T.dmg+=5;if(o.rosee)T.pp+=Math.min(30,5*((meta.cnt.bestR??0)+1));if(o.brise)T.crit+=10;if(o.ambre)T.pa+=1;if(o.pierre)T.res+=5;if(o.pelerin)T.potion+=1;if(o.or)T.gold+=30;if(o.grenat)T.stat+=8;if(o.givre)T.pierce+=8;const B=relB();T.hp+=B.hp;T.crit+=B.crit;T.dmg+=B.dmg;T.res+=B.res;T.pp+=B.pp;T.soin=B.soin;return T}
const hasT=k=>!!meta.talis[k];
function checkQuests(){let changed=false;
  TALIS.forEach(t=>{t.q.forEach(q=>{if(!meta.quests[q]&&QUESTS[q][1](meta)){meta.quests[q]=1;changed=true;toast('Quête réussie : '+QUESTS[q][0])}});
    if(!meta.talis[t.id]&&t.q.every(q=>meta.quests[q])){meta.talis[t.id]=1;changed=true;toast(`${t.i} ${t.n} obtenu ! ${t.b}`)}});
  if(changed)saveMeta()}

/* ================= Heroes ================= */
const xpNeed=l=>26*l;
const sc=u=>1+(u.lvl||1)*.045;
function newHero(cls,lvl){const c=CLASSES[cls];const h={id:'h'+(run.uid++),side:'h',cls,name:c.n,icon:c.i,lvl,xp:0,hp:1,row:c.row,slot:0,eq:{arme:null,coiffe:null,cape:null,anneau:null},alive:true,st:{},used:{},cd:{},pc:{},ptt:{},tcd:{},pa:6};h.hp=maxHp(h);return h}
function hstats(h){
  const c=CLASSES[h.cls],L=h.lvl,T=talB();
  const base={t:0,f:0,e:0,a:0,vita:Math.round(c.vit*L)};c.els.forEach(e=>base[e]+=Math.round(4.8*(L-1)));
  const it={t:0,f:0,e:0,a:0,vita:0,crit:0,pp:0,pui:0,soin:0,init:0,pa:0,res:{t:0,f:0,e:0,a:0}};const sets={},setMinR={};
  for(const x of Object.values(h.eq))if(x){for(const k in x.st){const v=x.st[k];if(k==='adapt')c.els.forEach(e=>it[e]+=v);else if(k[0]==='r'&&k.length===2)it.res[k[1]]+=v;else it[k]=(it[k]||0)+v}if(x.set&&x.set!=='relic'){sets[x.set]=(sets[x.set]||0)+1;setMinR[x.set]=Math.min(setMinR[x.set]??9,x.r)}}
  const setPA=Math.max(0,...Object.keys(sets).map(k=>sets[k]>=4?(setMinR[k]>=4?2:1):0));
  const tot=k=>k==='vita'?base[k]+it[k]:Math.round((base[k]+it[k])*(1+T.stat/100));const vita=base.vita+it.vita;
  return{base,it,t:tot('t'),f:tot('f'),e:tot('e'),a:tot('a'),vita,
    hp:Math.round((50+vita+tot('t')*.25)*(1+T.hp/100)),
    crit:Math.min(60,5+tot('a')/12+it.crit+T.crit),critD:30+tot('a')/6,esq:Math.min(25,tot('a')/20),
    pp:Math.round(100+tot('e')/2+it.pp+T.pp),soin:tot('f')*.42+it.soin+(T.soin||0),pui:it.pui+T.dmg,
    res:{t:it.res.t+T.res,f:it.res.f+T.res,e:it.res.e+T.res,a:it.res.a+T.res},
    pa:6+setPA+it.pa+T.pa,init:c.init+it.init+Math.floor(L/10),setPA}}
const maxHp=u=>u.side==='h'?hstats(u).hp:u.hpMax;
function heroCap(){return WORLDS[run.w].lv[1]}
function giveXp(h,n,lines){if(h.lvl>=heroCap())return;h.xp+=Math.round(n);while(h.xp>=xpNeed(h.lvl)&&h.lvl<heroCap()){const before=maxHp(h);h.xp-=xpNeed(h.lvl);h.lvl++;meta.cnt.maxLvl=Math.max(meta.cnt.maxLvl||0,h.lvl);if(h.alive)h.hp+=maxHp(h)-before;lines&&lines.push(`${h.name} passe niveau ${h.lvl}.`)}if(h.lvl>=heroCap())h.xp=0}
function healPct(h,p){if(!h.alive)return;h.hp=Math.min(maxHp(h),h.hp+Math.round(maxHp(h)*p))}
function checkSets(){run.heroes.forEach(h=>{if(hstats(h).setPA)meta.cnt.setDone=Math.max(meta.cnt.setDone,1)})}

function nodeType(r){if(r===1)return'fight';const w=[['fight',40],['hard',r>=2?16:0],['taverne',9],['sanct',6],['portal',8],['shop',7],['forge',6],['event',12]];let x=Math.random()*w.reduce((s,v)=>s+v[1],0);for(const [k,v] of w){if((x-=v)<0)return k}return'fight'}
function genMap(){const rows=[[{t:'start',l:[]}]];
  for(let r=1;r<=6;r++){const n=R(2,4),row=[];for(let i=0;i<n;i++)row.push({t:nodeType(r),l:[]});if((r===3||r===6)&&!row.some(n=>n.t==='taverne'))row[R(0,n-1)].t='taverne';rows.push(row)}
  rows.push([{t:'boss',l:[]}]);
  rows.forEach(row=>row.forEach((nd,i)=>{nd.x=clamp(Math.round((i+1)/(row.length+1)*100+(row.length>1?R(-5,5):0)),10,90);if(nd.t==='hard')nd.mod=pick(MODS).k}));
  for(let r=0;r<rows.length-1;r++){const A=rows[r],B=rows[r+1];A.forEach((nd,i)=>{if(A.length===1){nd.l=B.map((_,k)=>k);return}if(B.length===1){nd.l=[0];return}const j=Math.round(i*(B.length-1)/(A.length-1));nd.l=[j];if(Math.random()<.45){const j2=j+(Math.random()<.5?-1:1);if(j2>=0&&j2<B.length)nd.l.push(j2)}});
    B.forEach((nd,j)=>{if(!A.some(a=>a.l.includes(j))){let best=0,bd=1e9;A.forEach((a,i)=>{const d=Math.abs(a.x-nd.x);if(d<bd){bd=d;best=i}});A[best].l.push(j)}})}

  // starter gear
  run.heroes.forEach(h=>starterKit(h,WORLDS[w].lv[0],w));

    case'sanct':run.alphaB+=6;meta.cnt.sanct++;run.msg={icon:'🗿',title:'Sanctuaire',text:`Une statue couverte d'offrandes. Les monstres alpha apparaissent plus souvent pour le reste de la run (${alphaChance()} % par monstre).`};run.phase='msg';break;
    case'shop':{const L=zoneLevel(r),tr=tierOf(run.w,run.z);run.shop={items:Array.from({length:5},()=>{const it=genItem({L,tier:tr,r:rollR(DROPW.shop),set:Math.random()<.7?setOf(run.w,run.z):VAG});return{it,price:buyPrice(it),sold:false}})};ui.shopTab='buy';run.phase='shop';break}

function log(s){const c=C();if(!c)return;c.log.push(s);if(c.log.length>80)c.log.shift()}

function shield(t,v){if(!t.alive)return;v=Math.round(v);t.st.shield=(t.st.shield||0)+v;fx(t,'+'+v+' 🛡','shield')}
function heal(src,t,a,b,o={}){if(!t||!t.alive)return;let v=R(Math.round(a),Math.round(b));if(src.side==='h'&&!o.raw)v=Math.round(v*sc(src)*(1+hstats(src).soin/100));const real=Math.min(v,maxHp(t)-t.hp);t.hp+=real;if(t.side==='h')meta.cnt.healed=(meta.cnt.healed||0)+real;fx(t,'+'+v,'heal');log(`${t.name} récupère <b class="h">${v}</b> PV.`)}

function bsum(u,c){let s=0;const b=u&&u.st&&u.st.b;if(b)for(const k in b)if(b[k].c===c)s+=b[k].v;return s}
function tickB(u){const b=u.st.b;if(b)for(const k in b){if(--b[k].t<=0)delete b[k]}const c=C();if(c&&c.aegis&&c.aegis.by===u.id&&--c.aegis.t<=0){c.aegis=null;log('Le bastion se dissipe.')}}

function freeSlot(row,pref){const occ=new Set(C().enemies.filter(x=>x.alive&&x.row===row).map(x=>x.slot||0));if(!occ.has(pref))return pref;let i=0;while(occ.has(i))i++;return i}

function moveRow(t){if(!t||!t.alive)return;const to=oppRow(t.row);t.slot=freeSlot(to,t.slot||0);t.row=to;fx(t,to==='back'?'⇡ arrière':'⇣ avant','debuff');log(`${t.name} bascule en rangée ${to==='back'?'arrière':'avant'}.`);trapCheck(t)}

const TRAPN={fosse:'Fosse',eclats:'Chausse-trappe'};
function placeTrap(u,row,kind){const c=C();c.traps=(c.traps||[]).filter(x=>!(x.row===row&&x.kind===kind));c.traps.push({row,kind,by:u.id});log(`${u.name} piège la rangée ${row==='back'?'arrière':'avant'} (${TRAPN[kind]}).`);fx(u,'🪤','buff')}
function trapCheck(t){const c=C();if(!c.traps||!t.alive)return;const tr=c.traps.filter(x=>x.row===t.row);if(!tr.length)return;c.traps=c.traps.filter(x=>x.row!==t.row);
  tr.forEach(x=>{const u=unit(x.by);if(!u||!u.alive||!t.alive)return;const ch=1+bsum(u,'chakra')/100;log(`${TRAPN[x.kind]} se déclenche sous ${t.name} !`);
    if(x.kind==='fosse'){const n=rowOf(t).filter(y=>y!==t).length;hit(u,t,10,14,{mult:ch*(1+.3*n)})}
    else{const rest=rowOf(t).filter(y=>y!==t);hit(u,t,8,11,{mult:ch});rest.forEach(y=>hit(u,y,8,11,{mult:ch*.5,noCrit:1}))}
    u.st.trapCnt=(u.st.trapCnt||0)+1})}
function sweepList(u,t,kind){const c=C();if(!c||!t)return[t].filter(Boolean);if(kind==='s'&&c.lance&&c.lance.by===u.id&&c.lance.row==='back')return foesOf(u);return rowOf(t)}
function lanceSweep(u,t,a,b,kind){const c=C(),row=t.row,list=sweepList(u,t,kind),n=list.length;
  list.forEach(x=>hit(u,x,a,b,{mult:kind==='f'?1+.15*n:1}));
  if(kind==='m'&&u.alive)shield(u,6*sc(u)*n);
  const L=c.lance;if(L&&L.by===u.id&&(L.row===row||kind==='s'&&L.row==='back')){L.dur--;if(L.dur<=0){c.lance=null;if(u.alive){shield(u,maxHp(u)*.15);log('La lance se brise et te protège.')}}}}
function detonate(u){const c=C();foesOf(u).filter(e=>e.st.bomb).forEach(e=>{const b=e.st.bomb;e.st.bomb=0;const row=rowOf(e).filter(x=>x!==e);
  const hitB=(x,lo,hi,o)=>{const r=hit(u,x,lo,hi,o);if(u.st.resq&&x.alive){x.st.paLoss=(x.st.paLoss||0)+2;fx(x,'−2 PA','debuff')}return r};
  if(e.alive)hitB(e,8*b,12*b);row.forEach(x=>hitB(x,4*b,6*b,{noCrit:1}))})}
function heroMult(h,S,e){return 1+(S[e]+S.pui)/100+(e!=='f'?S.f*.002:0)}
function bestEl(h,t,S){let best=null,bv=-1e9;CLASSES[h.cls].els.forEach(e=>{const v=heroMult(h,S,e)*(1-clamp(t?resOf(t,e):0,-50,60)/100);if(v>bv){bv=v;best=e}});return best}
/* Every damage modifier except the crit roll, shared by real hits and by the previews shown on spells. */
function dmgMult(src,t,el,o={},S){
  S=S||(src.side==='h'?hstats(src):null);
  let m=S?(CLASSES[src.cls].els.includes(el)?heroMult(src,S,el):Math.max(...CLASSES[src.cls].els.map(x=>heroMult(src,S,x)))):(1+(src.st.buff||0)/100)*(src.turnMul||1);
  m*=1+bsum(src,'dmg')/100;
  if(src.side==='h'&&C()){const P=run.heroes.find(h=>h.alive&&h.st.portals);if(P){const n=P.st.portals;if(P===src)m*=1+.02*n;else if(src.row===P.row)m*=1+.01*n}}
  if(t&&t.st.b)for(const k in t.st.b){const b=t.st.b[k];if(b.c==='mark'){const by=unit(b.by);if(src.id===b.by||(by&&src.side==='h'&&src.row===by.row))m*=1+b.v/100}}
  if(t)m*=1+bsum(t,'tk')/100;
  if(src.st.elan)m*=1+.1*src.st.elan;
  if(src.st.cri)m*=1.3;
  if(src.st.howl)m*=1.15;
  if(src.st.rage)m*=1+.1*src.st.rage;
  if(t&&src.st.prey&&src.st.prey===t.id)m*=1.25;
  if(src.st.ambush&&!o.noCrit)m*=1.5;
  if(o.mult)m*=o.mult;
  if(src.st.weak)m*=.75;
  let res=t?resOf(t,el):0;if(o.pierce&&res>0)res/=2;if(S&&t&&hasT('givre'))res-=8;
  return m*(1-clamp(res,-50,60)/100)}
function hit(src,t,a,b,o={}){
  if(!t||!t.alive)return null;
  if(src.side==='e'&&t.side==='h'&&t.st.guardBy){const g=unit(t.st.guardBy);if(g&&g.alive&&g!==t){t=g}}
  if(src.side==='e'&&t.side==='h'&&t.st.decoy){delete t.st.decoy;fx(t,'Leurre !','buff');log(`Le leurre de ${t.name} encaisse le coup.`);return{d:0}}
  if(src.side==='e'&&!o.aoe){const ev=esq(t);if(ev&&Math.random()*100<ev){fxA({k:'hit',s:src.id,t:t.id,el:src.el,miss:1});fx(t,'Esquive','buff');log(`${t.name} esquive.`);return{d:0}}}
  const S=src.side==='h'?hstats(src):null;
  const el=o.el||(S?bestEl(src,t,S):src.el);
  let mult=dmgMult(src,t,el,o,S);
  if(src.st.ambush&&!o.noCrit)src.st.ambush=0;
  let crit=false;
  if(!o.noCrit){const cc=S?Math.min(75,S.crit+(src.st.chance||0)*10+(src.st.critBuff?15:0)+bsum(src,'crit')):(src.alpha?10:5);if(src.st.focus){crit=true;src.st.focus=0}else crit=Math.random()*100<cc}
  if(crit)mult*=1+((S?S.critD:30)+bsum(t,'critTk'))/100;
  let d=Math.max(1,Math.round(R(Math.round(a),Math.round(b))*mult));const d0=d;
  if(src.side==='e'&&t.side==='h'){const c=C();
    if(c.aegis&&c.aegis.row===t.row){const a2=Math.min(c.aegis.hp,d);c.aegis.hp-=a2;d-=a2;log(`Le bastion encaisse ${a2}.`);if(c.aegis.hp<=0){c.aegis=null;log('Le bastion tombe.')}if(!d){fx(t,'🏰 '+a2,'shield');return{d:0,crit}}}
    if(t.row==='back'){const v=heroesAlive().find(x=>x!==t&&bsum(x,'valkyr'));if(v){const s2=Math.round(d/2);d-=s2;const ab=Math.min(v.st.shield||0,s2);if(ab)v.st.shield-=ab;v.hp=Math.max(0,v.hp-(s2-ab));fx(v,'-'+s2,'dmg');log(`${v.name} encaisse ${s2} à la place de ${t.name}.`);if(v.hp<=0)ko(v)}}}
  const abs=Math.min(t.st.shield||0,d);if(abs)t.st.shield-=abs;
  const real=d-abs;t.hp=Math.max(0,t.hp-real);
  if(t.side==='h'){t.st.taken=(t.st.taken||0)+real;meta.cnt.taken=(meta.cnt.taken||0)+real}
  if(S&&real>0&&(src.turns||0)<=1)src.st.dealtT1=1;
  if(S&&real>0&&hasT('agate'))heroesAlive().forEach(a=>{if(a!==src)a.st.b=Object.assign(a.st.b||{},{agate:{c:'dmg',v:5,t:Math.max(1,(a.st.b&&a.st.b.agate&&a.st.b.agate.t)||0,C()&&C().cur===a.id?2:1)}})});
  if(S){if(crit)meta.cnt.crits++;if(d>meta.cnt.maxHit)meta.cnt.maxHit=d;
    if(real>0&&src.alive&&run.heroes.some(h=>h.alive&&h.st.flair===t.id)){const v=Math.round(real*.15);if(v){src.hp=Math.min(maxHp(src),src.hp+v);fx(src,'+'+v,'heal')}}}
  fxA({k:'hit',s:src.id,t:t.id,el,crit,real,d,rg:src.side==='e'?!src.melee:src.row==='back'});fx(t,real?'-'+d:'🛡 '+abs,crit?'crit':real?'dmg':'shield');

let fxl=null,lastCur=null,live=[],busyTill=0;
function layer(){if(!fxl||!fxl.isConnected){fxl=document.createElement('div');fxl.id='fxl';document.body.appendChild(fxl)}return fxl}
const docRect=el=>{const r=el.getBoundingClientRect();return{x:r.left+scrollX,y:r.top+scrollY,w:r.width,h:r.height}};
const ctr=r=>({x:r.x+r.w/2,y:r.y+r.h/2});
const tokEl=id=>document.querySelector(`.tok[data-uid="${id}"]`);
const rnd=(a,b)=>a+Math.random()*(b-a);
function tA(id,part,kf,opts){const start=performance.now();live.push({id,part,kf,opts,start});applyA(live[live.length-1],0)}
function applyA(a,t){const tok=tokEl(a.id);if(!tok)return;const el=a.part?tok.querySelector(a.part):tok;if(!el||!el.animate)return;try{const an=el.animate(a.kf,a.opts);if(t)an.currentTime=t}catch(e){}}
function replayLive(){const now=performance.now();live=live.filter(a=>now-a.start<(a.opts.delay||0)+a.opts.duration);live.forEach(a=>applyA(a,now-a.start))}
function put(cls,x,y,html){const d=document.createElement('div');d.className=cls;d.style.left=x+'px';d.style.top=y+'px';if(html)d.innerHTML=html;layer().appendChild(d);return d}
function anim(el,kf,o){const a=el.animate(kf,Object.assign({fill:'both'},o));a.onfinish=()=>el.remove();return a}

/* ---------- avant redessin : photo des jetons ---------- */
function snapToks(){
  if(!(ui.screen==='run'&&run&&run.phase==='combat'))return null;const s={};
  document.querySelectorAll('.tok[data-uid]').forEach(el=>{const id=el.dataset.uid,u=unit(id),ring=el.querySelector('.ring');
    const e={r:docRect(ring||el),tr:docRect(el),p:ring?+ring.style.getPropertyValue('--p'):100,ko:el.classList.contains('ko')};
    if(u&&!u.alive&&u.side==='e'&&!e.ko)e.clone=el.cloneNode(true);s[id]=e});
  const sc=document.querySelector('.scard.sel');if(sc)s._card={r:docRect(sc),clone:sc.cloneNode(true)};
  return s}

/* ---------- particules & effets ---------- */
function burst(p,el,n,o={}){
  const col=ELC[el]||'#ffd27a',sp=o.sp||1;
  for(let i=0;i<n;i++){const d=put('pt pt-'+(el||'x'),p.x,p.y);d.style.setProperty('--c',col);
    const a=rnd(0,Math.PI*2),r=rnd(22,58)*sp,dx=Math.cos(a)*r,dy=Math.sin(a)*r;
    const g=el==='e'?28:el==='t'?34:el==='f'?-26:0,rot=el==='a'?a*57+90:rnd(0,360),s=rnd(.6,1.25)*(o.big?1.3:1);
    anim(d,[{transform:`translate(-50%,-50%) rotate(${rot}deg) scale(${s})`,opacity:1},{transform:`translate(calc(-50% + ${dx*.75}px),calc(-50% + ${dy*.75}px)) rotate(${rot+40}deg) scale(${s})`,opacity:1,offset:.55},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+g}px)) rotate(${rot+70}deg) scale(${s*.3})`,opacity:0}],{duration:rnd(420,680),delay:o.delay||0,easing:'cubic-bezier(.15,.7,.3,1)'})}}
function ring(p,col,o={}){const d=put('shock',p.x,p.y);d.style.setProperty('--c',col);const s=o.s||1;
  anim(d,[{transform:'translate(-50%,-50%) scale(.2)',opacity:.95},{transform:`translate(-50%,-50%) scale(${1.6*s})`,opacity:0}],{duration:o.dur||420,delay:o.delay||0,easing:'cubic-bezier(.2,.8,.3,1)'})}
function slash(p,el,crit,delay){const d=put('slash'+(crit?' crit':''),p.x,p.y);d.style.setProperty('--c',ELC[el]||'#fff');const r=rnd(-40,-15);
  anim(d,[{transform:`translate(-50%,-50%) rotate(${r}deg) scaleX(.1)`,opacity:0},{transform:`translate(-50%,-50%) rotate(${r}deg) scaleX(1.1)`,opacity:1,offset:.35},{transform:`translate(-50%,-50%) rotate(${r}deg) scaleX(1.25)`,opacity:0}],{duration:300,delay})}
function projectile(A,B,el,delay,dur){const d=put('proj proj-'+(el||'x'),A.x,A.y);d.style.setProperty('--c',ELC[el]||'#ffd27a');
  const dx=B.x-A.x,dy=B.y-A.y,ang=Math.atan2(dy,dx)*57.3;
  anim(d,[{transform:`translate(-50%,-50%) rotate(${ang}deg) scale(.4)`,opacity:0},{transform:`translate(calc(-50% + ${dx*.12}px),calc(-50% + ${dy*.12}px)) rotate(${ang}deg) scale(1)`,opacity:1,offset:.15},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${ang}deg) scale(1.1)`,opacity:1}],{duration:dur,delay,easing:'cubic-bezier(.5,0,.9,.6)'})}
function aura(p,cls,delay){
  if(cls==='heal'){for(let i=0;i<7;i++){const d=put('spark heal',p.x+rnd(-22,22),p.y+rnd(-4,16));anim(d,[{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.3},{transform:`translate(-50%,calc(-50% - ${rnd(30,52)}px)) scale(.5)`,opacity:0}],{duration:rnd(600,850),delay:delay+i*45,easing:'ease-out'})}ring(p,'#7cf0a0',{delay,s:.8})}
  else if(cls==='shield'){ring(p,'#7cc0ec',{delay,s:.9,dur:520});const d=put('hexa',p.x,p.y);anim(d,[{transform:'translate(-50%,-50%) scale(.7)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:.9,offset:.35},{transform:'translate(-50%,-50%) scale(1.05)',opacity:0}],{duration:650,delay})}
  else if(cls==='buff'){for(let i=0;i<6;i++){const d=put('ray',p.x+rnd(-24,24),p.y+rnd(0,18));anim(d,[{transform:'translate(-50%,0) scaleY(.2)',opacity:0},{transform:'translate(-50%,-14px) scaleY(1)',opacity:1,offset:.35},{transform:'translate(-50%,-40px) scaleY(.4)',opacity:0}],{duration:620,delay:delay+i*50})}}
  else if(cls==='debuff'){for(let i=0;i<8;i++){const a=i/8*Math.PI*2,d=put('spark debuff',p.x+Math.cos(a)*30,p.y+Math.sin(a)*30);anim(d,[{transform:'translate(-50%,-50%) scale(1)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.25},{transform:`translate(calc(-50% + ${-Math.cos(a)*26}px),calc(-50% + ${-Math.sin(a)*26}px)) scale(.3)`,opacity:0}],{duration:560,delay:delay+i*25,easing:'ease-in'})}}}
function shakeStage(power,delay){const st=document.querySelector('.stage');if(!st)return;const p=power;setTimeout(()=>{const s=document.querySelector('.stage');s&&s.animate([{transform:'none'},{transform:`translate(${-p}px,${p*.5}px)`},{transform:`translate(${p}px,${-p*.4}px)`},{transform:`translate(${-p*.6}px,${p*.3}px)`},{transform:'none'}],{duration:280})},delay)}
function flashScreen(col,delay){const d=put('scrflash',0,0);d.style.setProperty('--c',col);anim(d,[{opacity:0},{opacity:.5,offset:.2},{opacity:0}],{duration:320,delay})}
function banner(txt,sub,cls,delay){const d=put('ban2 '+cls,0,0,`<div class="b2in"><b>${txt}</b>${sub?`<small>${sub}</small>`:''}</div>`);d.style.top=(scrollY+innerHeight*.36)+'px';
  anim(d,[{opacity:0,transform:'translateY(-50%) scale(1.25)',easing:'cubic-bezier(.2,.9,.3,1.2)'},{opacity:1,transform:'translateY(-50%) scale(1)',offset:.14},{opacity:1,transform:'translateY(-50%) scale(1.02)',offset:.8,easing:'ease-in'},{opacity:0,transform:'translateY(-50%) scale(1.04)'}],{duration:1300,delay})}

/* ---------- après redessin ---------- */
function lootFx(){if(RM())return;const el=[...document.querySelectorAll('.lines div')].find(d=>/écus/.test(d.textContent));if(!el)return;
  const m=/\+([\d\s ]+) écus/.exec(el.textContent);if(!m)return;const N=+m[1].replace(/\D/g,'');const tn=[...el.childNodes].find(x=>x.nodeType===3&&/écus/.test(x.textContent));if(!tn)return;
  const t0=performance.now(),D=900;const step=now=>{const k=Math.min(1,(now-t0-250)/D);if(!tn.isConnected)return;tn.textContent=`+${fmt(Math.round(N*Math.max(0,1-Math.pow(1-k,3))))} écus `;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);
  const P=ctr(docRect(el));const src={x:innerWidth/2+scrollX,y:P.y-140};
  for(let i=0;i<Math.min(14,4+N/8|0);i++){const d=put('coinfx',src.x+rnd(-90,90),src.y+rnd(-30,10));const dx=P.x-60-parseFloat(d.style.left),dy=P.y-parseFloat(d.style.top);
    anim(d,[{transform:'translate(-50%,-50%) scale(0)',opacity:0},{transform:'translate(-50%,-50%) scale(1.1)',opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.5)`,opacity:.2}],{duration:rnd(650,900),delay:150+i*45,easing:'cubic-bezier(.5,0,.75,.4)'})}}
function flushFx(snap,entering,changedTo){
  const q=fxq;fxq=[];const c=ui.screen==='run'&&run&&run.phase==='combat'?C():null;
  if(!c){if(changedTo==='loot')lootFx();q.filter(f=>f.k==='ban').forEach(b=>banner(b.txt,b.sub,b.cls,0));return}
  replayLive();const rm=RM();snap=snap||{};
  const posOf=id=>{const s=snap[id];if(s&&s.clone)return ctr(s.r);const el=tokEl(id);const r=el&&el.querySelector('.ring');return r?ctr(docRect(r)):s?ctr(s.r):null};
  const hits=q.filter(f=>f.k==='hit'),acts=q.filter(f=>f.k==='act');
  const actor=acts.length?acts[0].s:null;
  const imp={};let last=0;
  /* 1. l'acteur s'élance, la carte jouée s'envole */
  if(actor&&!rm){
    const A=posOf(actor),mine=hits.filter(h=>h.s===actor);
    if(snap._card&&unit(actor)&&unit(actor).side==='h'){const k=snap._card,d=k.clone;d.classList.add('cardfly');d.style.left=k.r.x+'px';d.style.top=k.r.y+'px';d.style.width=k.r.w+'px';d.style.height=k.r.h+'px';layer().appendChild(d);anim(d,[{transform:'none',opacity:1},{transform:'translateY(-26px) scale(1.06)',opacity:1,offset:.35},{transform:'translateY(-90px) scale(.7)',opacity:0}],{duration:380,easing:'cubic-bezier(.3,.7,.4,1)'})}
    if(mine.length&&A){
      const T=mine.map(h=>posOf(h.t)).filter(Boolean);const mx=T.reduce((s,p)=>s+p.x,0)/T.length,my=T.reduce((s,p)=>s+p.y,0)/T.length;
      const L=Math.hypot(mx-A.x,my-A.y)||1,ux=(mx-A.x)/L,uy=(my-A.y)/L;
      tA(actor,'',[{transform:'none'},{transform:`translate(${-ux*6}px,${-uy*6}px) scale(.97)`,offset:.3},{transform:`translate(${ux*20}px,${uy*20}px) scale(1.1)`,offset:.55},{transform:'none'}],{duration:380,easing:'ease-out'});
      mine.forEach((h,i)=>{const B=posOf(h.t);let t;if(!B){t=200}else{const dist=Math.hypot(B.x-A.x,B.y-A.y),launch=150+i*70;
        if(dist>150||h.rg){const dur=Math.max(150,Math.min(280,dist/1.5));projectile(A,B,h.el,launch,dur);t=launch+dur}else t=200+i*70}
        h.time=t;if(imp[h.t]==null)imp[h.t]=t;last=Math.max(last,t)})}
    else if(A){tA(actor,'.ring',[{transform:'scale(1)',filter:'none'},{transform:'scale(1.12)',filter:'brightness(1.5)',offset:.4},{transform:'scale(1)',filter:'none'}],{duration:420});last=180}}
  hits.forEach(h=>{if(h.time==null){h.time=rm?0:last+60;if(imp[h.t]==null)imp[h.t]=h.time;last=Math.max(last,h.time)}});
  /* 2. impacts */
  if(!rm)hits.forEach(h=>{const P=posOf(h.t);if(!P)return;const t=h.time;
    if(h.miss){ring(P,'#ffffff',{delay:t,s:.6});return}
    if(!h.real){ring(P,'#7cc0ec',{delay:t,s:.9});tA(h.t,'.ring',[{transform:'scale(1)'},{transform:'scale(.94)',offset:.3},{transform:'scale(1)'}],{duration:260,delay:t});return}
    slash(P,h.el,h.crit,t);burst(P,h.el,h.crit?16:9,{delay:t,big:h.crit,sp:h.crit?1.4:1});
    if(!snap[h.t]||!snap[h.t].clone)tA(h.t,'.ring',[{transform:'none',filter:'none'},{transform:'translateX(-5px) rotate(-3deg)',filter:'brightness(2.2)',offset:.2},{transform:'translateX(5px) rotate(2deg)',filter:'brightness(1.3)',offset:.45},{transform:'translateX(-2px)',offset:.7},{transform:'none',filter:'none'}],{duration:360,delay:t});
    if(h.crit){ring(P,ELC[h.el]||'#ffd27a',{delay:t,s:1.4});shakeStage(6,t);flashScreen('#fff3c4',t)}
    else if(unit(h.t)&&unit(h.t).side==='h'&&h.d>=maxHp(unit(h.t))*.25)shakeStage(4,t)});
  /* 3. chiffres flottants */
  const n={};q.filter(f=>f.txt!=null).forEach(f=>{const P=posOf(f.id);if(!P)return;const i=n[f.id]=(n[f.id]||0)+1;
    const base=imp[f.id]!=null?imp[f.id]:(actor&&!rm?(f.id===actor?120:220):0),d=base+(i-1)*140;
    const s=put('float '+f.cls,P.x,P.y-30+((i-1)%3)*20);s.textContent=f.txt;s.style.animationDelay=d+'ms';setTimeout(()=>s.remove(),d+1300);
    if(!rm&&imp[f.id]==null&&['heal','shield','buff','debuff'].includes(f.cls))aura(P,f.cls,d)});
  /* 4. barres de vie : la vie glisse, une traînée claire suit */
  if(!rm)document.querySelectorAll('.tok[data-uid]').forEach(el=>{const id=el.dataset.uid,s=snap[id];if(!s)return;const r=el.querySelector('.ring'),to=+r.style.getPropertyValue('--p');
    const d=imp[id]!=null?imp[id]:(n[id]?(actor?220:0):0);
    if(s.p!==to){tA(id,'.ring',[{'--p':s.p},{'--p':to}],{duration:320,delay:d,fill:'backwards',easing:'ease-out'});if(to<s.p)tA(id,'.ring',[{'--lag':s.p},{'--lag':s.p,offset:.35},{'--lag':to}],{duration:900,delay:d,fill:'backwards',easing:'ease-in'})}
    if(!s.ko&&el.classList.contains('ko'))tA(id,'',[{opacity:1,filter:'none',transform:'none'},{opacity:1,filter:'brightness(2)',transform:'scale(1.06)',offset:.15},{opacity:.4,filter:'grayscale(1)',transform:'translateY(4px) rotate(-5deg)'}],{duration:700,delay:d+120,fill:'backwards'})});
  /* 5. fantômes des ennemis vaincus, puis les survivants glissent à leur nouvelle place */
  let koEnd=0;
  if(!rm)for(const id in snap){const s=snap[id];if(id[0]==="_"||!s||!s.clone)continue;const t=imp[id]!=null?imp[id]:last;const g=s.clone;
    g.classList.remove('tgt','cur');g.classList.add('ghost');g.querySelectorAll('.intent,.tpips').forEach(x=>x.remove());g.removeAttribute('data-uid');
    g.style.left=s.tr.x+'px';g.style.top=s.tr.y+'px';g.style.width=s.tr.w+'px';layer().appendChild(g);
    const gr=g.querySelector('.ring');gr&&gr.animate([{'--p':s.p},{'--p':0}],{duration:260,delay:t,fill:'both'});
    const col=getComputedStyle(g).getPropertyValue('--elc')||'#ffd27a',P=ctr(s.r);
    anim(g,[{transform:'none',filter:'none',opacity:1},{transform:'none',filter:'none',opacity:1,offset:.3},{transform:'scale(1.1)',filter:'brightness(2.4) saturate(0)',opacity:1,offset:.45},{transform:'scale(.6) translateY(-18px)',filter:'brightness(1.6) blur(4px) saturate(0)',opacity:0}],{duration:1000,delay:t});
    setTimeout(()=>{burst(P,null,14,{sp:1.5});const w=put('wisp',P.x,P.y);anim(w,[{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-70%) scale(1)',opacity:.9,offset:.3},{transform:'translate(-50%,-220%) scale(.5)',opacity:0}],{duration:900})},t+420);
    ring(P,col.trim()||'#ffd27a',{delay:t+420,s:1.3,dur:520});koEnd=Math.max(koEnd,t+520)}
  if(!rm)document.querySelectorAll('.tok[data-uid]').forEach(el=>{const s=snap[el.dataset.uid];if(!s)return;const r=docRect(el),dx=s.tr.x-r.x,dy=s.tr.y-r.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3)tA(el.dataset.uid,'',[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:420,delay:koEnd,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'})});
  /* 6. entrée en combat */
  if(entering&&!rm){let i=0,j=0;document.querySelectorAll('.foes2 .tok').forEach(el=>tA(el.dataset.uid,'',[{transform:'translateY(-46px) scale(.7)',opacity:0},{transform:'translateY(4px) scale(1.04)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:520,delay:120+90*i++,fill:'backwards',easing:'ease-out'}));
    document.querySelectorAll('.team2 .tok').forEach(el=>tA(el.dataset.uid,'',[{transform:'translateY(40px)',opacity:0},{transform:'none',opacity:1}],{duration:420,delay:60*j++,fill:'backwards',easing:'cubic-bezier(.2,.8,.2,1)'}));
    if(c.kind==='boss')banner('Gardien du donjon',c.enemies.find(e=>e.boss)?.name,'enc boss',150);else if(c.kind==='hard')banner('Combat difficile','Plus de monstres, meilleur butin','enc',150)}
  /* 7. changement de tour */
  if(c.cur!==lastCur){const u=unit(c.cur);lastCur=c.cur;if(u&&u.alive&&!rm){const d=entering?600:0;
    if(u.side==='e')tA(u.id,'.ring',[{transform:'scale(1)',filter:'none'},{transform:'scale(1.13) translateY(3px)',filter:'brightness(1.3) drop-shadow(0 0 10px #ff6a4a)',offset:.7},{transform:'scale(1.08) translateY(2px)',filter:'brightness(1.2) drop-shadow(0 0 8px #ff6a4a)'}],{duration:560,delay:d,fill:'forwards',easing:'ease-in'});
    else tA(u.id,'.ring',[{transform:'scale(1)'},{transform:'scale(1.14)',offset:.4},{transform:'scale(1)'}],{duration:460,delay:d,easing:'cubic-bezier(.3,1.6,.5,1)'})}}
  /* 8. bannières (victoire / défaite) */
  const now=performance.now();busyTill=Math.max(busyTill,now+Math.max(last,koEnd));
  q.filter(f=>f.k==='ban').forEach(b=>{const d=Math.max(0,busyTill-now)+100;banner(b.txt,b.sub,b.cls,rm?0:d);if(b.cls==='win'&&!rm)setTimeout(()=>{const P={x:innerWidth/2+scrollX,y:scrollY+innerHeight*.36};for(let i=0;i<3;i++)burst(P,null,12,{sp:2.6,delay:i*120})},d+120)})}

/* ================= Daily challenge ================= */
const todayKey=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function seeded(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function withSeed(seed,fn){const old=Math.random;Math.random=seeded(seed);try{return fn()}finally{Math.random=old}}
function dailyCfg(){const key=todayKey();const s=hashRes('daily-'+key);const rnd=seeded(s);const w=Math.floor(rnd()*meta.unlocked);
  const cls=shuffleR(ORDER.slice(),rnd).slice(0,2);const mods=MODS.filter(m=>m.k!=='nombreux');const mod=mods[Math.floor(rnd()*mods.length)];return{key,seed:s,w,star:3,cls,mod:mod.k}}
function shuffleR(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startDaily(){const D=dailyCfg();ui.world=D.w;ui.star=D.star;startRun(D.cls);run.daily={key:D.key,seed:D.seed,mod:D.mod,kills:0};
  run.rows=withSeed(D.seed+run.z*977,genMap);meta.daily=meta.daily||{};const R=meta.daily[D.key]=meta.daily[D.key]||{best:0,tries:0};R.tries++;saveMeta();saveRun()}
function dailyScore(win){const d=run.daily;return(run.z*8+run.pos.r)*100+(d.kills||0)*10+Math.round(run.gold/10)+(win?3000:0)}
function dailyEnd(win){if(!run||!run.daily||run.daily.scored)return;const sc=dailyScore(win);run.daily.score=sc;run.daily.scored=1;const R=meta.daily[run.daily.key]=meta.daily[run.daily.key]||{best:0,tries:1};run.daily.prev=R.best;R.best=Math.max(R.best,sc);saveMeta()}

function shRules(){return sheet('Règles',`<div class="rules">
 <h4>La run</h4><p>Une run se joue dans un monde, qui couvre une tranche de niveaux. Chaque monde enchaîne 6 zones ; chaque zone est une carte qu'on traverse jusqu'au donjon. Battre le boss du donjon ouvre la zone suivante ; battre le dernier boss gagne la run. Tu pars avec deux héros et tu peux en recruter d'autres en taverne, jusqu'à quatre.</p>
 <h4>Les PV</h4><p>Les PV ne remontent pas entre deux combats. Pour se soigner : la taverne (la moitié des PV max, et relève les K.O.), les potions, et la victoire contre un boss de donjon, qui remet toute l'équipe sur pied. Si toute l'équipe tombe, la run s'arrête : tu perds les héros, l'équipement et les écus.</p>
 <h4>La carte</h4><ul><li>${ico('fight')} <b>Combat</b> : un groupe de monstres.</li><li>${ico('hard')} <b>Combat dur</b> : des ennemis renforcés (le bonus s'affiche quand tu touches la case), mais un meilleur butin.</li><li>${ico('taverne')} <b>Taverne</b> : soin ou recrutement.</li><li>${ico('sanct')} <b>Sanctuaire</b> : plus de monstres alpha pour le reste de la run.</li><li>${ico('portal')} <b>Portail</b> : la rencontre n'est révélée qu'en arrivant.</li><li>${ico('shop')} <b>Comptoir</b> : acheter et revendre des objets.</li><li>${ico('forge')} <b>Forge</b> : faire monter un objet d'une rareté.</li><li>${ico('boss')} <b>Donjon</b> : le boss de la zone.</li></ul>
 <h4>Le combat</h4><p>Chacun joue à son tour, dans l'ordre d'initiative affiché en haut. Chaque héros dépense ses PA en sorts ou en attaque d'arme. Chaque camp a une ligne avant et une ligne arrière : la plupart des attaques ne visent que la ligne avant ; quand elle est vide, la ligne arrière est exposée. Tu places tes héros dans l'écran Formation.</p><p>L'élément de frappe est choisi tout seul : à chaque coup, le héros frappe dans celui de ses deux éléments que la cible résiste le moins. Les résistances des monstres s'affichent sur leur carte.</p>
 <h4>Les caractéristiques</h4><ul><li><b>Force</b> ${elIco('t')} : donne aussi des PV.</li><li><b>Intelligence</b> ${elIco('f')} : augmente aussi tous les dégâts et les soins.</li><li><b>Agilité</b> ${elIco('a')} : chance et dégâts de coup critique, et esquive.</li><li><b>Chance</b> ${elIco('e')} : donne aussi de la prospection, qui fait tomber plus d'objets et d'écus.</li></ul><p>Les caractéristiques montent toutes seules avec le niveau.</p>
 <h4>Équipement et écus</h4><p>Chaque héros porte une arme, une coiffe, une cape et un anneau. Les objets tombent en combat, en six raretés : <span class="r0">commun</span>, <span class="r1">rare</span>, <span class="r2">épique</span>, <span class="r3">légendaire</span>, <span class="r4">mythique</span> et <span class="r5">divin</span> (extrêmement rare). Les quatre pièces d'une même panoplie donnent +1 PA, et +2 PA si elles sont toutes mythiques ou divines. ★ Adapt. s'ajoute aux deux éléments du héros qui le porte. Les écus ${coin()} se gagnent en combat et en revendant des objets au comptoir ; ils servent au comptoir et à la forge.</p>
 <h4>Ce qui reste après la mort</h4><p>Les talismans : chacun donne un bonus permanent à toutes tes runs suivantes. On les obtient en terminant les groupes de quêtes du menu Succès. Les reliques : un boss peut en lâcher une par zone. Elles ne s'équipent pas : chacune donne un petit bonus à toute l'équipe, à chaque run. Restent aussi le bestiaire et la progression des quêtes.</p>
 <h4>Monstres alpha</h4><p>N'importe quel monstre peut apparaître en version alpha, plus forte. La vaincre l'ajoute au bestiaire. Le bestiaire complet du Monde 1 donne le Talisman d'Ambre.</p>
 <h4>Étoiles</h4><p>Les étoiles d'un monde règlent sa difficulté, d'une (normal) à cinq. Gagner une run débloque l'étoile suivante, et gagner un monde ouvre le monde suivant.</p></div>`)}

function normSlots(){['front','back'].forEach(r=>{const l=run.heroes.filter(h=>h.row===r).sort((a,b)=>(a.slot||0)-(b.slot||0));const used=new Set();l.forEach(h=>{if(h.slot==null||h.slot>3||used.has(h.slot)){let s=0;while(used.has(s))s++;h.slot=s}used.add(h.slot)})})}
function relicPanel(){const own=Object.keys(meta.relics).filter(k=>{const [w,z]=k.split('_').map(Number);return WORLDS[w]&&RELFX[z]});const B=relB();
  const sum=[['hp','% PV'],['crit','% crit'],['dmg','% dégâts'],['res','% rés.'],['pp',' prosp.'],['soin','% soins']].filter(([k])=>B[k]).map(([k,u])=>`+${String(Math.round(B[k]*10)/10).replace('.',',')}${u}`).join(' · ');
  return`<div class="relics"><div class="rhead"><b>Reliques</b><small>${own.length} / ${WORLDS.length*ZONES} · actives pour toute l’équipe, à chaque run</small></div>${own.length?`<div class="rsum">${sum}</div><div class="rlist" hidden>${own.map(k=>{const [w,z]=k.split('_').map(Number);return`<span class="rel" title="${relicName(w,z)}"><i>${RELIC[z][0]}</i>${relicName(w,z)}<em>${relicTxt(w,z)}</em></span>`}).join('')}</div>`:'<small class="mute">Les boss de donjon peuvent en lâcher une (une par zone).</small>'}</div>`}
function shRelics(){const own=k=>!!meta.relics[k];
  return sheet('Reliques',`${relicPanel()}
  ${WORLDS.map((W,w)=>{const n=W.zones.filter((_,z)=>own(w+'_'+z)).length;return`<span class="lab">Monde ${w+1} · ${W.n} <small class="mute" style="font-family:var(--f-body);font-size:13px">${n}/${ZONES}</small></span>
   <div class="rgrid">${W.zones.map((Z,z)=>{const k=w+'_'+z,o=own(k);return`<div class="rtile ${o?'on':''}"><i class="rart">${RELART[k]||RELIC[z][0]}${o?'':`<span class="rlock">${ico('lock')}</span>`}</i><b>${o?relicName(w,z):'Relique inconnue'}</b><small>${o?relicTxt(w,z):'Boss : '+Z[2][0]}</small></div>`}).join('')}</div>`}).join('')}`)}
function shInv(){const h=run.heroes[ui.invHero]||run.heroes[0];const S=hstats(h);const sets={};const minR={};Object.values(h.eq).forEach(x=>{if(x&&x.set!=='relic'){sets[x.setN]=(sets[x.setN]||0)+1;minR[x.setN]=Math.min(minR[x.setN]??9,x.r)}});
  return sheet('Équipement',`<div class="tabs">${run.heroes.map((x,i)=>`<button class="tab ${x===h?'on':''}" data-a="invh" data-v="${i}">${ava(x,'sm')} ${x.name}</button>`).join('')}</div>
  <div class="chips"><span class="chip">PV max ${S.hp}</span><span class="chip" style="color:#bfe3ff">${S.pa} PA</span><span class="chip">Prosp. ${S.pp}</span></div>
  <div class="stack">${Object.keys(SLOTS).map(s=>{const it=h.eq[s];return it?itemBtn(it,`<span class="slotlab">${SLOTS[s]}</span>`):`<div class="item" style="opacity:.55;border-style:dashed"><div class="it-top"><span class="it-ico">${ico(s)}</span><b class="mute">${SLOTS[s]} : vide</b></div></div>`}).join('')}</div>
  ${Object.entries(sets).map(([n,c])=>`<div class="chips"><span class="chip ${c>=4?'g':''}">${n} ${c}/4${c>=4?(minR[n]>=4?' · +2 PA ✓ (mythique ou divine)':' · +1 PA ✓ · tout en mythique ou divin : +2 PA'):' · 4 pièces : +1 PA, +2 en mythique ou divin'}</span></div>`).join('')}
  <div style="display:flex;align-items:center;gap:8px"><span class="lab" style="flex:1">Sac (${run.inv.length})</span><button class="tab ${ui.invSort==='tier'?'on':''}" data-a="invsort" data-v="tier">Palier</button><button class="tab ${ui.invSort==='type'?'on':''}" data-a="invsort" data-v="type">Type</button></div>
  <div class="stack">${sortedInv().map(it=>itemBtn(it)).join('')||'<p class="mute">Le sac est vide.</p>'}</div>`)}
function shItem(){const f=findItem(ui.itemId);if(!f)return null;const it=f.it;const h=run.heroes[ui.invHero]||run.heroes[0];const cur=h.eq[it.slot];
  let diff='';if(f.where==='inv'){const keys=[...new Set(Object.keys(it.st).concat(cur?Object.keys(cur.st):[]))];diff=keys.map(k=>{const d=(it.st[k]||0)-(cur?cur.st[k]||0:0);return d?`<span class="chip ${d>0?'up':'dn'}">${d>0?'+':''}${d} ${STL[k]}</span>`:''}).join('')}
  let wdiff='';if(f.where==='inv'&&it.w){const ca=cur&&cur.w?cur.w:{a:3,b:5};const da=Math.round((it.w.a+it.w.b)/2-(ca.a+ca.b)/2);if(da)wdiff=`<span class="chip ${da>0?'up':'dn'}">${da>0?'+':''}${da} ⚔ moy.</span>`}
  const atShop=run.phase==='shop',atForge=run.phase==='forge';
  return sheet(SLOTS[it.slot],`<div class="item ir${it.r}">${itemHTML(it)}</div>
  ${f.where!=='inv'?`<p class="mute" style="margin:0">Porté par ${f.where.name}.</p><button class="btn" data-a="unequip" data-v="${it.id}">Retirer</button>`:`
   <div class="tabs">${run.heroes.map((x,i)=>`<button class="tab ${x===h?'on':''}" data-a="invh" data-v="${i}">${ava(x,'sm')} ${x.name}</button>`).join('')}</div>
   <div class="cmp"><span class="lab">Équipé sur ${h.name}</span>${cur?`<div class="item ir${cur.r}">${itemHTML(cur)}</div>`:'<p class="mute" style="margin:0">Rien dans cet emplacement.</p>'}
   ${diff||wdiff?`<span class="lab">Si tu équipes le nouvel objet</span><div class="chips">${diff}${wdiff}</div>`:''}</div>
   <button class="btn main" data-a="equip" data-v="${it.id}">Équiper sur ${h.name}</button>`}
  ${atShop&&f.where==='inv'?`<button class="btn" data-a="sell" data-v="${it.id}">Vendre · ${coin()} ${fmt(sellPrice(it))}</button>`:''}
  ${atForge&&it.r<FORGE_MAX?`<button class="btn" data-a="forge" data-v="${it.id}" ${run.gold<forgeCost(it)?'disabled':''}>Forger en <span class="r${it.r+1}">${RAR[it.r+1].l}</span> · ${coin()} ${fmt(forgeCost(it))}</button>`:''}
  ${!atShop&&f.where==='inv'?'<p class="mute" style="margin:0;font-size:13px">Les objets se revendent au comptoir.</p>':''}`)}
function shPotion(){return sheet('Potions',`<p class="mute" style="margin:0"><b style="color:#a9f0b8">${run.potions} potion${run.potions>1?'s':''}</b> sur ${run.potMax}. Une potion rend 35 % des PV max à un héros (pas aux K.O.). Chaque donjon vaincu en rend une.</p>
  <div class="stack">${run.heroes.map(h=>`<button class="bline" data-a="drink" data-v="${h.id}" ${!run.potions||!h.alive||h.hp>=maxHp(h)||run.phase==='combat'?'disabled style="opacity:.45"':''}>${ava(h,'sm')}<div class="meta"><b>${h.name}</b><small>${h.alive?`${h.hp}/${maxHp(h)} PV`:'K.O.'}</small></div>${ico('potion')}</button>`).join('')}</div>
  ${run.phase==='combat'?'<p class="mute" style="margin:0">Les potions se boivent hors combat.</p>':''}`)}
function shLog(){const c=C();return sheet('Journal',`<div class="log" style="display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--mute)">${c?c.log.slice().reverse().map(l=>`<div>${l}</div>`).join(''):''}</div>`)}
function shInspect(){const u=unit(ui.inspect);if(!u)return null;
  if(u.side==='e')return sheet(u.name,`<div class="hcard"><div class="top">${ava(u)}<div class="meta"><b class="num">${u.hp}/${u.hpMax} PV</b><br><small class="mute">Niveau ${u.lvl} · ${u.boss?'Boss':u.melee?'Mêlée':'Distance'} · frappe en ${ELN[u.el]} ${elIco(u.el)} · init. ${u.init}${u.alpha?' · alpha':''}</small></div></div>
    <span class="lab">Résistances</span><div class="chips">${EL.map(e=>`<span class="chip ${u.res[e]<0?'up':u.res[e]>0?'dn':''}">${elIco(e)} ${u.res[e]>0?'+':''}${u.res[e]}%</span>`).join('')}</div>
    <div class="chips">${stChips(u)}${u.st.shield?`<span class="chip s">🛡 ${u.st.shield}</span>`:''}</div>
    <span class="lab">Cycle d'actions</span><div class="splist">${u.mv.map((m,i)=>`<div style="${i===u.mi%u.mv.length?'color:var(--ink);font-weight:700':''}">${i===u.mi%u.mv.length?'▶ ':''}${INTENT_LONG[m[0]]}</div>`).join('')}</div></div>`);
  const S=hstats(u);return sheet(u.name,`<div class="hcard"><div class="top">${ava(u)}<div class="meta"><b class="num">${u.alive?u.hp+'/'+S.hp+' PV':'K.O.'}</b> ${els(u.cls)}<br><small class="mute">Crit ${Math.round(S.crit)}% · Dmg crit ${Math.round(S.critD)}% · Soins ${Math.round(S.soin)}% · Esquive ${Math.round(S.esq)}%</small></div></div>
   <div class="chips">${EL.map(e=>`<span class="chip">${elIco(e)} ${S.res[e]}%</span>`).join('')}${stChips(u)}${u.st.shield?`<span class="chip s">🛡 ${u.st.shield}</span>`:''}</div>
   <div class="splist">${spellIds(u).map(id=>spellLine(id,spellOf(u,id),u)).join('')}</div></div>`)}
function shMenu(){return sheet('Menu',`<div class="iconbar" style="flex-wrap:wrap">${TOOLS.concat([['rules','scroll','Règles']]).map(([k,i,l])=>`<button class="ib" data-a="sheet" data-v="${k}">${ico(i)}${l}</button>`).join('')}</div>
  <button class="btn" data-a="sheet" data-v="save">Sauvegarde</button>
  <button class="btn" data-a="home">${ico('home')} Retour à l'accueil</button><p class="mute" style="margin:0;font-size:13px">La run est enregistrée à chaque action.</p>`)}
/* ================= Actions ================= */
const A={
  world:v=>{ui.world=+v;ui.star=meta.worlds[ui.world].starMax;store.set('rdp2_ui_w',ui.world);render()},
  star:v=>{ui.star=+v;render()},
  play:()=>{ui.pick=[];ui.screen='pick';render()},
  pickc:c=>{const p=ui.pick;const i=p.indexOf(c);if(i>=0)p.splice(i,1);else{if(p.length>=2)p.shift();p.push(c)}render()},
  start:()=>{if(ui.pick.length!==2)return;startRun(ui.pick);ui.screen='run';render()},
  continue:()=>{ui.screen='run';ui.confirm=null;render();resume()},
  home:()=>{ui.screen='home';ui.modal=null;ui.confirm=null;clearTimeout(timer);busy=false;render()},
  confirm:v=>{ui.confirm=v||null;render()},
  abandon:()=>{clearTimeout(timer);busy=false;meta.cnt.runsEnded++;run.phase='end';updateZoneMax();checkQuests();saveMeta();run=null;saveRun();ui.confirm=null;render()},
  endok:()=>{run=null;saveRun();ui.screen='home';ui.star=meta.worlds[ui.world].starMax;render()},
  sheet:v=>{ui.modal=v;if(v==='inv'||v==='item'){}if(v==='best'&&run)ui.bestW=run.w;render()},
  close:()=>{ui.modal=null;ui.form=null;render()},
  mapsel:v=>{ui.mapSel=ui.mapSel===v?null:v;render()},
  go:v=>{const [r,i]=v.split(':').map(Number);enterNode(r,i)},
  spell:id=>{const c=C();const h=unit(c.cur);if(!h||h.side!=='h'||busy)return;if(blockReason(h,id))return;const sp=spellOf(h,id);
    if(ui.sel===id&&!targetsFor(h,sp))return cast(h,id,null);ui.sel=ui.sel===id?null:id;render()},
  target:id=>{const c=C();const h=unit(c.cur);if(!h||!ui.sel||busy)return;const t=unit(id);const sp=spellOf(h,ui.sel);const vt=validTargets(h,ui.sel);if(!vt||!vt.includes(t))return;cast(h,ui.sel,t)},
  inspect:id=>{ui.inspect=id;ui.modal='inspect';render()},
  end:()=>{clearTimeout(timer);endHeroTurn(false)},
  lootok:()=>afterLoot(),
  evc:v=>{const E=EVENTS.find(e=>e.id===run.ev.id);const c=E.c[+v];if(!c||(c.ok&&!c.ok()))return;const r=c.f();if(r&&r.fight){run.ev=null;startCombat('hard',pick(MODS.filter(m=>m.k!=='nombreux')).k);return}run.ev.res=r;checkQuests();saveMeta();saveRun();render()},
  evok:()=>{run.ev=null;run.phase='map';saveRun();render()},
  daily:()=>{if(run&&run.phase!=='end')return;startDaily();ui.screen='run';render()},
  copysave:()=>{const t=document.getElementById('savecode');const v=t.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Code copié'),()=>{t.select();try{document.execCommand('copy');toast('Code copié')}catch(e){toast('Sélectionne le code et copie-le')}})},
  dlsave:()=>{const b=new Blob([saveCode()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rogue-de-poche-'+todayKey()+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  loadsave:()=>{const v=(document.getElementById('loadcode')||{}).value||'';if(!v.trim())return toast('Colle d’abord un code ou choisis un fichier');let d;try{d=loadCode(v)}catch(e){return toast('Code invalide')}
    if(ui.confirm!=='load'){ui.confirm='load';toast('Touche encore « Charger » pour confirmer : la progression actuelle sera remplacée');ui._pending=v;return}
    meta=Object.assign(freshMeta(),d.meta);meta.cnt=Object.assign({...CNT0},meta.cnt);run=d.run||null;saveMeta();saveRun();ui.confirm=null;ui.modal=null;ui.screen='home';toast('Sauvegarde chargée');render()},
  msgok:()=>{run.msg=null;run.phase='map';saveRun();render()},
  leave:()=>{run.tav=null;run.shop=null;run.phase='map';ui.modal=null;saveRun();render()},
  tavheal:()=>{run.heroes.forEach(h=>{if(!h.alive){h.alive=true;h.hp=0}h.hp=Math.min(maxHp(h),h.hp+Math.round(maxHp(h)*.5));h.st={}});meta.cnt.tavHeals++;run.tav.done="L'équipe mange, boit et dort. Chacun récupère la moitié de ses PV max.";checkQuests();saveRun();render()},
  recruit:c=>{if(run.heroes.length>=4)return;meta.cnt.recruits=(meta.cnt.recruits||0)+1;const lv=Math.max(...run.heroes.map(h=>h.lvl));const h=newHero(c,Math.max(WORLDS[run.w].lv[0],lv-1));normSlots();const used=run.heroes.filter(x=>x.row===h.row).map(x=>x.slot);let s=0;while(used.includes(s))s++;if(s>3){h.row=h.row==='front'?'back':'front';const u2=run.heroes.filter(x=>x.row===h.row).map(x=>x.slot);s=0;while(u2.includes(s))s++}h.slot=s;run.heroes.push(h);
    starterKit(h,h.lvl,run.w);
    meta.cnt.maxTeam=Math.max(meta.cnt.maxTeam,run.heroes.length);run.tav.done=`${CLASSES[c].n} rejoint l'équipe au niveau ${h.lvl}, ${run.w?'avec une panoplie de départ':'sans équipement'}. Place-le dans la Formation si besoin.`;checkQuests();saveMeta();saveRun();render()},
  sellgreen:()=>{if(run.phase!=='shop')return;const g=run.inv.filter(x=>x.r===0);const p=g.reduce((s,x)=>s+sellPrice(x),0);run.gold+=p;meta.cnt.sold+=g.length;run.inv=run.inv.filter(x=>x.r!==0);meta.cnt.maxGold=Math.max(meta.cnt.maxGold,run.gold);toast(`${g.length} objets vendus : +${fmt(p)} ✦`);checkQuests();saveMeta();saveRun();render()},
  shoptab:v=>{ui.shopTab=v;render()},
  buy:i=>{const x=run.shop.items[+i];if(x.sold||run.gold<x.price)return;run.gold-=x.price;meta.cnt.spent+=x.price;meta.cnt.bought++;x.sold=true;addInv(x.it);toast(x.it.name+' ajouté au sac');checkQuests();saveMeta();saveRun();render()},
  item:id=>{ui.itemId=id;ui.modal='item';render()},
  invh:i=>{ui.invHero=+i;render()},
  invsort:v=>{ui.invSort=v;render()},
  equip:id=>{const f=findItem(id);const h=run.heroes[ui.invHero]||run.heroes[0];if(!f||f.where!=='inv')return;equip(h,f.it);ui.modal=run.phase==='loot'?null:'inv';saveMeta();saveRun();render()},
  unequip:id=>{const f=findItem(id);if(!f||f.where==='inv')return;unequip(f.where,f.it.slot);ui.modal='inv';saveRun();render()},
  sell:id=>{const f=findItem(id);if(!f||f.where!=='inv'||run.phase!=='shop')return;const p=sellPrice(f.it);run.gold+=p;run.inv=run.inv.filter(x=>x.id!==id);meta.cnt.sold++;meta.cnt.maxGold=Math.max(meta.cnt.maxGold,run.gold);ui.modal=null;toast(`Vendu : +${fmt(p)} ✦`);checkQuests();saveMeta();saveRun();render()},
  forge:id=>{const f=findItem(id);if(!f||f.it.r>=FORGE_MAX)return;const c=forgeCost(f.it);if(run.gold<c)return;const h=f.where!=='inv'?f.where:null;const before=h?maxHp(h):0;run.gold-=c;meta.cnt.spent+=c;forgeItem(f.it);if(h&&h.alive)h.hp=clamp(h.hp+maxHp(h)-before,1,maxHp(h));toast(`${f.it.name} devient ${RAR[f.it.r].l} !`);checkQuests();saveMeta();saveRun();render()},
  drink:id=>{const h=run.heroes.find(x=>x.id===id);if(!h||!h.alive||!run.potions||run.phase==='combat')return;run.potions--;healPct(h,.35);meta.cnt.potions++;checkQuests();saveMeta();saveRun();render()},
  formslot:v=>{const [row,i]=v.split(':');const s=+i;const occ=run.heroes.find(x=>x.row===row&&x.slot===s);
    if(!ui.form){if(occ)ui.form=occ.id;return render()}
    const h=run.heroes.find(x=>x.id===ui.form);if(!h){ui.form=null;return render()}
    if(occ&&occ!==h){occ.row=h.row;occ.slot=h.slot}h.row=row;h.slot=s;ui.form=null;saveRun();render()},
  questT:v=>{ui.questT=ui.questT===v?null:v;ui.modal='quests';render()},
  bestw:v=>{ui.bestW=+v;ui.bestZ=null;render()},
  bestz:v=>{ui.bestZ=ui.bestZ===+v?null:+v;render()},
  enc:v=>{ui.encCls=v;render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v)});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='loadfile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const t=document.getElementById('loadcode');if(t)t.value=String(r.result).trim();toast('Fichier chargé, touche « Charger »')};r.readAsText(e.target.files[0])}});
modal.addEventListener('click',e=>{if(e.target===modal){ui.modal=null;ui.form=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
function resume(){
  if(!run||run.phase!=='combat'||!C())return;const c=C();
  if(c.over){return later(()=>{c.enemies.some(e=>e.alive)?defeat():victory()},300)}
  const u=unit(c.cur);
  if(!u||!u.alive){busy=false;return later(nextTurn,300)}
  if(u.side==='e'){busy=true;render();later(()=>enemyAct(u),600)}
  else{busy=false;render();if(!anyCastable(u))autoPass(u)}}

/* ================= Boot ================= */
function boot(data){if(data&&data.run){run=data.run;ui.screen=data.screen||'home'}checkQuests();render();if(ui.screen==='run')resume()}
try{window.claude?.hot?.snapshot?.(()=>({run,screen:ui.screen}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
